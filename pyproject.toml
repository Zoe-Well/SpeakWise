[project]
name = "speakwise"
version = "0.1.0"
description = "智能面试助手（Interview Copilot）后端服务"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3",
    "sqlmodel>=0.0.22",
    "httpx>=0.27,<0.28",
    "sse-starlette>=2.1,<3",
    "openai>=1.50,<2",
    "python-multipart>=0.0.12",
    "pypdf>=5.0,<6",
    "python-docx>=1.1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
]
